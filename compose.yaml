services:
  l0-spider:
    image: ${L0_SPIDER_IMAGE:-l0-spider:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${L0_SPIDER_NODE_IMAGE:-node:22-bookworm-slim}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5173"
      LIVE_RELOAD: "0"
      BUILD_ON_START: "0"
      TZ: ${L0_SPIDER_TIMEZONE:?L0_SPIDER_TIMEZONE must be set in .env.docker}
      DB_INFO_PATH: ${L0_SPIDER_DB_INFO_CONTAINER_PATH:-/appdata/l0_spider/db_info.pkl}
      SENSOR_EXCLUSION_CONFIG_PATH: /opt/l0-spider/config/sensor-exclusions.json
    ports:
      - "${L0_SPIDER_BIND_IP:-127.0.0.1}:${L0_SPIDER_HOST_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: ${L0_SPIDER_APPDATA_PATH:-/appdata}
        target: /appdata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${L0_SPIDER_SENSOR_CONFIG_DIR:-./config}
        target: /opt/l0-spider/config
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
